<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOBRAIN Challenge</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 24px;
      width: 100%;
      max-width: 400px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    h1 {
      color: #38bdf8;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .question {
      font-size: 18px;
      margin-bottom: 20px;
      line-height: 1.4;
      font-weight: 600;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      background-color: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn:active {
      transform: scale(0.98);
      background-color: #0284c7;
    }
    .score {
      margin-top: 20px;
      font-size: 14px;
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>NOBRAIN Challenge 🧠</h1>
    <p class="subtitle">Half Human, Half AI. 100% Zero-Stress.</p>
    
    <div id="game">
      <div class="question" id="question-text">Loading question...</div>
      <div class="options" id="options-container"></div>
      <div class="score" id="score-text">Score: 0</div>
    </div>
  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const questions = [
      {
        q: "What travels around the world but stays in one corner?",
        options: ["A Stamp", "A Crypto Coin", "The Wind"],
        answer: 0
      },
      {
        q: "What has a head and a tail, but no body?",
        options: ["A Robot", "A Coin", "A Snake"],
        answer: 1
      },
      {
        q: "What building has the most stories?",
        options: ["Blockchain", "A Skyscraper", "A Library"],
        answer: 2
      },
      {
        q: "What gets sharper the more you use it?",
        options: ["A Knife", "The Brain / AI", "A Pencil"],
        answer: 1
      }
    ];

    let currentQ = 0;
    let score = 0;

    function loadQuestion() {
      if (currentQ >= questions.length) {
        document.getElementById('game').innerHTML = `
          <h2>🎉 Challenge Completed!</h2>
          <p style="margin: 15px 0; font-size: 18px;">Your Final Score: <strong>${score} / ${questions.length}</strong></p>
          <button class="btn" style="width: 100%; background: #0284c7;" onclick="location.reload()">Play Again 🚀</button>
        `;
        return;
      }

      const qData = questions[currentQ];
      document.getElementById('question-text').innerText = qData.q;
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      qData.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index);
        container.appendChild(btn);
      });

      document.getElementById('score-text').innerText = `Score: ${score}`;
    }

    function checkAnswer(selected) {
      if (selected === questions[currentQ].answer) {
        score++;
      }
      currentQ++;
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
