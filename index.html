<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$NOBRAIN - Half Human, Half AI</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 20px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    .logo-img {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: 3px solid #38bdf8;
      margin-bottom: 12px;
      object-fit: cover;
    }
    h1 {
      color: #38bdf8;
      font-size: 24px;
      margin-bottom: 6px;
    }
    .tagline {
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 16px;
    }
    .links-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 8px;
    }
    .btn-link {
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 600;
      font-size: 13px;
      display: block;
      transition: background 0.2s;
    }
    .btn-link:active {
      background: #0369a1;
    }
    .btn-pump {
      background: #22c55e;
      grid-column: span 2;
    }
    .btn-pump:active {
      background: #15803d;
    }
    .stats-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      margin-top: 10px;
      display: flex;
      justify-content: space-around;
      font-size: 12px;
    }
    .stat-item span {
      display: block;
      color: #38bdf8;
      font-weight: bold;
      font-size: 14px;
    }
    /* Game Styling */
    .question {
      font-size: 16px;
      margin-bottom: 16px;
      line-height: 1.4;
      font-weight: 600;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn-opt {
      background-color: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 12px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
    .btn-opt:active {
      background-color: #38bdf8;
      color: #0f172a;
    }
    .score {
      margin-top: 14px;
      font-size: 13px;
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header & Hub Section -->
    <div class="card">
      <img src="https://raw.githubusercontent.com/morinyo511/nobrain-game/main/logo.jpg" onerror="this.src='https://via.placeholder.com/90/38bdf8/ffffff?text=NOBRAIN'" class="logo-img" alt="$NOBRAIN">
      <h1>$NOBRAIN</h1>
      <p class="tagline">Half Human. Half AI. 100% Zero-Stress Synergy.</p>
      
      <div class="links-grid">
        <a href="https://pump.fun" target="_blank" class="btn-link btn-pump">🚀 Buy on Pump.fun</a>
