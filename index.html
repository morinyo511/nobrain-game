<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>$NOBRAIN - Official Web3 Hub</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 12px;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .card {
      background-color: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      padding: 16px;
      text-align: center;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    .logo-img {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      border: 2px solid #38bdf8;
      margin-bottom: 8px;
      object-fit: cover;
    }
    h1 {
      color: #38bdf8;
      font-size: 22px;
      margin-bottom: 4px;
    }
    .tagline {
      color: #94a3b8;
      font-size: 12px;
      margin-bottom: 12px;
    }
    .links-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-link {
      background: #0284c7;
      color: #fff;
      text-decoration: none;
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 13px;
      display: block;
      text-align: center;
    }
    .btn-pump {
      background: #22c55e;
    }
    .stats-box {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 10px;
      margin-top: 10px;
      display: flex;
      justify-content: space-around;
      font-size: 11px;
    }
    .stat-item span {
      display: block;
      color: #38bdf8;
      font-weight: bold;
      font-size: 13px;
    }
    /* Game Styling */
    .question {
      font-size: 15px;
      margin-bottom: 12px;
      line-height: 1.3;
      font-weight: 600;
    }
    .options {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn-opt {
      background-color: #334155;
      color: #f8fafc;
      border: 1px solid #475569;
      padding: 10px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .btn-opt:active {
      background-color: #38bdf8;
      color: #0f172a;
    }
    .score {
      margin-top: 10px;
      font-size: 12px;
      color: #38bdf8;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- Header & Hub Section -->
    <div class="card">
      <img src="https://raw.githubusercontent.com/morinyo511/nobrain-game/main/logo.jpg" onerror="this.style.display='none'" class="logo-img" alt="$NOBRAIN">
      <h1>$NOBRAIN</h1>
      <p class="tagline">Half Human. Half AI. 100% Zero-Stress.</p>
      
      <div class="links-grid">
        <a href="https://pump.fun" target="_blank" class="btn-link btn-pump">🚀 Buy on Pump.fun</a>
        <a href="https://x.com/NoBrainAI8k" target="_blank" class="btn-link">🌐 Official X Account</a>
        <a href="https://t.me/nobrain_game_bot" target="_blank" class="btn-link">📢 Telegram Channel</a>
      </div>

      <div class="stats-box">
        <div class="stat-item">Chain <span>Solana</span></div>
        <div class="stat-item">Tax <span>0%</span></div>
        <div class="stat-item">Supply <span>1B $NBT</span></div>
      </div>
    </div>

    <!-- Mini-App Game Section -->
    <div class="card">
      <h2 style="font-size: 16px; color: #38bdf8; margin-bottom: 10px;">🧠 Trivia Challenge</h2>
      
      <div id="game">
        <div class="question" id="question-text">Loading question...</div>
        <div class="options" id="options-container"></div>
        <div class="score" id="score-text">Score: 0</div>
      </div>
    </div>

  </div>

  <script>
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();

    const questions = [
      {
        q: "What travels around the world but stays in one corner?",
        options: ["A Stamp", "A Crypto Coin", "The Wind"],
        answer: 0
      },
      {
        q: "What has a head and a tail, but no body?",
        options: ["A Robot", "A Coin", "A Snake"],
        answer: 1
      },
      {
        q: "What gets sharper the more you use it?",
        options: ["A Knife", "The Brain / AI", "A Pencil"],
        answer: 1
      }
    ];

    let currentQ = 0;
    let score = 0;

    function loadQuestion() {
      if (currentQ >= questions.length) {
        document.getElementById('game').innerHTML = `
          <h3>🎉 Challenge Completed!</h3>
          <p style="margin: 10px 0; font-size: 15px;">Your Final Score: <strong>${score} / ${questions.length}</strong></p>
          <button class="btn-opt" style="width: 100%; background: #0284c7; color: #fff;" onclick="location.reload()">Play Again 🚀</button>
        `;
        return;
      }

      const qData = questions[currentQ];
      document.getElementById('question-text').innerText = qData.q;
      const container = document.getElementById('options-container');
      container.innerHTML = '';

      qData.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'btn-opt';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(index);
        container.appendChild(btn);
      });

      document.getElementById('score-text').innerText = `Score: ${score}`;
    }

    function checkAnswer(selected) {
      if (selected === questions[currentQ].answer) {
        score++;
      }
      currentQ++;
      loadQuestion();
    }

    loadQuestion();
  </script>
</body>
</html>
